name: 'Verify separate clusters'
description: 'Fails when the local and remote test nodes report the same cluster_uuid, which means they merged into one cluster'

inputs:
  admin-password:
    description: 'The admin password for both nodes'
    required: true
  local-port:
    description: 'The HTTP port of the local node'
    required: false
    default: '9200'
  remote-port:
    description: 'The HTTP port of the remote node'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Verify local and remote clusters are separate
      shell: bash
      env:
        ADMIN_PASSWORD: ${{ inputs.admin-password }}
        LOCAL_PORT: ${{ inputs.local-port }}
        REMOTE_PORT: ${{ inputs.remote-port }}
      run: |
        set -euo pipefail
        extract_uuid() {
          curl -s -k -u "admin:${ADMIN_PASSWORD}" "$1" \
            | sed -n 's/.*"cluster_uuid"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
        }
        # A freshly started node briefly reports "_na_" until its cluster
        # state is recovered; retry rather than compare transient values.
        for i in $(seq 1 12); do
          local_uuid=$(extract_uuid "https://localhost:${LOCAL_PORT}/")
          remote_uuid=$(extract_uuid "https://localhost:${REMOTE_PORT}/")
          if [ -n "$local_uuid" ] && [ -n "$remote_uuid" ] \
            && [ "$local_uuid" != "_na_" ] && [ "$remote_uuid" != "_na_" ]; then
            break
          fi
          sleep 5
        done
        echo "local:  $local_uuid"
        echo "remote: $remote_uuid"
        if [ -z "$local_uuid" ] || [ -z "$remote_uuid" ] \
          || [ "$local_uuid" = "_na_" ] || [ "$remote_uuid" = "_na_" ]; then
          echo "ERROR: could not obtain a settled cluster_uuid from both nodes."
          exit 1
        fi
        if [ "$local_uuid" = "$remote_uuid" ]; then
          echo "ERROR: the local (${LOCAL_PORT}) and remote (${REMOTE_PORT}) nodes report the same cluster_uuid - they merged into one cluster."
          exit 1
        fi
